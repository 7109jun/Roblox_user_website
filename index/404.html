<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#FAFAD2">
  <title>Roblox User Website</title>
  <style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#FAFAD2;color:#000;font-family:system-ui,sans-serif}.card{max-width:520px;margin:24px;padding:28px;border:2px solid #000;border-radius:20px;background:#D4EDDA;box-shadow:7px 7px 0 #000;text-align:center}.card a{display:inline-block;margin-top:16px;padding:12px 16px;border:2px solid #000;border-radius:12px;background:#FAFAD2;color:#000;text-decoration:none;font-weight:800;box-shadow:4px 4px 0 #000}</style>
</head>
<body>
  <main class="card">
    <h1>페이지를 찾을 수 없습니다.</h1>
    <p>Roblox User Website의 홈으로 이동하세요.</p>
    <a id="home" href="./">HOME</a>
  </main>
  <script>
    // Avoid an automatic redirect: GitHub Pages project paths and custom domains vary.
    // Keep the relative HOME link valid in both root Pages and project Pages deployments.
    const link = document.getElementById('home');
    if (location.hostname.endsWith('.github.io')) {
      const parts = location.pathname.split('/').filter(Boolean);
      const base = parts.length ? '/' + parts[0] + '/' : '/';
      link.href = base;
    } else {
      link.href = '/';
    }
  </script>
</body>
</html>
